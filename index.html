<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F5EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Augalų šimtukas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F5EE;
    --card:#FFFFFF;
    --ink:#17261C;
    --ink-soft:#5A6B5F;
    --line:#DCE5D8;
    --leaf:#4E9A2E;
    --leaf-deep:#2F6B2A;
    --leaf-tint:#E4F0DC;
    --sun:#F2B632;
    --clay:#C0562F;
    --cam:#0B140E;
    --radius:16px;
    --nav-h:76px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Nunito',system-ui,sans-serif;
    font-size:16px;
    line-height:1.45;
    -webkit-tap-highlight-color:transparent;
    min-height:100dvh;
  }
  button{font-family:inherit;color:inherit;cursor:pointer;}
  button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px;}
  .latin{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:500;}

  #app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;}
  .screen{display:none;padding:0 16px calc(var(--nav-h) + 36px + env(safe-area-inset-bottom));}
  .screen.active{display:block;}

  /* Top bar */
  .topbar{
    position:sticky;top:0;z-index:5;
    background:linear-gradient(var(--bg) 82%, rgba(241,245,238,0));
    padding:calc(14px + env(safe-area-inset-top)) 0 12px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .topbar h1{margin:0;font-size:26px;font-weight:800;line-height:1.1;}
  .topbar p{margin:2px 0 0;font-size:14px;color:var(--ink-soft);}
  .ring{position:relative;width:62px;height:62px;flex-shrink:0;}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring .track{stroke:var(--line);}
  .ring .bar{stroke:var(--leaf);transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1);}
  .ring .num{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:800;font-size:18px;line-height:1;
  }
  .ring .num small{font-size:10px;font-weight:700;color:var(--ink-soft);margin-top:2px;}

  /* Filter chips */
  .chips{
    display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;margin:0 -16px 6px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;border:1.5px solid var(--line);background:var(--card);
    border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;
    min-height:40px;
  }
  .chip[aria-pressed="true"]{background:var(--leaf-deep);border-color:var(--leaf-deep);color:#fff;}

  /* Sections & grid */
  .section{margin:6px 0 22px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
  .section-head h2{margin:0;font-size:18px;font-weight:800;}
  .section-head span{font-size:14px;font-weight:700;color:var(--ink-soft);}
  .section-bar{height:4px;border-radius:4px;background:var(--line);margin-bottom:12px;overflow:hidden;}
  .section-bar i{display:block;height:100%;border-radius:4px;transition:width .6s ease;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .card{
    position:relative;display:flex;flex-direction:column;padding:0;overflow:hidden;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    aspect-ratio:1/1.2;
  }
  .card .pic{flex:1;display:grid;place-items:center;background:var(--leaf-tint);overflow:hidden;min-height:0;}
  .card .pic img{width:100%;height:100%;object-fit:cover;display:block;}
  .card .pic .ph{font-size:34px;filter:grayscale(1);opacity:.35;}
  .card .nm{padding:6px 7px 8px;font-size:12.5px;font-weight:700;line-height:1.2;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em;}
  .card.missing .nm{color:var(--ink-soft);font-weight:600;}
  .card .tick{
    position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;
    background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;
    box-shadow:0 0 0 2px #fff;
  }
  .card.flash{animation:cardflash 1.4s ease;}
  @keyframes cardflash{0%,100%{box-shadow:0 0 0 0 rgba(242,182,50,0)}30%{box-shadow:0 0 0 5px rgba(242,182,50,.9)}}
  .empty{padding:30px 10px;text-align:center;color:var(--ink-soft);}

  /* Bottom nav */
  .nav{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);
    width:min(480px,100%);height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:var(--card);border-top:1px solid var(--line);z-index:10;
    display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;
  }
  .nav button.tab{
    background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:13px;font-weight:700;color:var(--ink-soft);height:100%;
  }
  .nav button.tab[aria-current="page"]{color:var(--leaf-deep);}
  .nav button.tab svg{width:26px;height:26px;}
  .fab{
    justify-self:center;width:72px;height:72px;border-radius:50%;
    background:var(--leaf);border:6px solid var(--bg);color:#fff;
    display:grid;place-items:center;margin-top:-34px;
    box-shadow:0 6px 16px rgba(47,107,42,.35);
  }
  .fab svg{width:32px;height:32px;}
  .fab:active{transform:scale(.95);}

  /* Camera overlay */
  .overlay{position:fixed;inset:0;z-index:50;display:none;}
  .overlay.open{display:block;}
  #camera{background:var(--cam);color:#fff;}
  #camera video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .shade-top,.shade-bot{position:absolute;left:0;right:0;pointer-events:none;}
  .shade-top{top:0;height:140px;background:linear-gradient(rgba(0,0,0,.55),transparent);}
  .shade-bot{bottom:0;height:240px;background:linear-gradient(transparent,rgba(0,0,0,.65));}
  .cam-close{
    position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;
    width:46px;height:46px;border-radius:50%;border:none;background:rgba(0,0,0,.45);color:#fff;
    display:grid;place-items:center;
  }
  .cam-close svg{width:22px;height:22px;}
  .reticle{
    position:absolute;left:50%;top:44%;width:min(72vw,320px);aspect-ratio:1;transform:translate(-50%,-50%);
    pointer-events:none;
  }
  .reticle i{position:absolute;width:34px;height:34px;border:4px solid rgba(255,255,255,.9);}
  .reticle i:nth-child(1){top:0;left:0;border-right:none;border-bottom:none;border-top-left-radius:14px;}
  .reticle i:nth-child(2){top:0;right:0;border-left:none;border-bottom:none;border-top-right-radius:14px;}
  .reticle i:nth-child(3){bottom:0;left:0;border-right:none;border-top:none;border-bottom-left-radius:14px;}
  .reticle i:nth-child(4){bottom:0;right:0;border-left:none;border-top:none;border-bottom-right-radius:14px;}
  .cam-tip{
    position:absolute;left:0;right:0;bottom:calc(150px + env(safe-area-inset-bottom));
    text-align:center;font-weight:700;font-size:15px;padding:0 24px;text-shadow:0 1px 6px rgba(0,0,0,.7);
  }
  .cam-bar{
    position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom));
    display:grid;grid-template-columns:1fr 86px 1fr;align-items:center;padding:0 22px;
  }
  .shutter{
    width:80px;height:80px;border-radius:50%;background:#fff;border:6px solid rgba(255,255,255,.45);
    background-clip:padding-box;justify-self:center;
  }
  .shutter:active{transform:scale(.93);}
  .shutter:disabled{opacity:.5;}
  .gallery{
    width:52px;height:52px;border-radius:14px;border:2px solid rgba(255,255,255,.8);background:rgba(0,0,0,.35);
    color:#fff;display:grid;place-items:center;justify-self:start;
  }
  .gallery svg{width:26px;height:26px;}
  .cam-fallback{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:30px;text-align:center;background:var(--cam);
  }
  .cam-fallback.show{display:flex;}
  .cam-fallback p{margin:0;max-width:30ch;color:#C9D6CC;}

  /* Result overlay */
  #result{background:var(--bg);overflow-y:auto;}
  .res-photo{
    position:relative;width:100%;height:min(46vh,380px);background:#000;
    border-bottom-left-radius:30px;border-bottom-right-radius:30px;overflow:hidden;
  }
  .res-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .scanline{
    position:absolute;left:0;right:0;height:80px;top:-80px;
    background:linear-gradient(transparent,rgba(120,220,80,.55),transparent);
    animation:scan 1.8s ease-in-out infinite;
  }
  @keyframes scan{0%{top:-80px}100%{top:100%}}
  .res-body{padding:20px 20px calc(30px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;}
  .tag{
    display:inline-block;padding:5px 12px;border-radius:999px;font-weight:800;font-size:14px;
    background:var(--leaf-tint);color:var(--leaf-deep);margin-bottom:10px;
  }
  .tag.new{background:var(--sun);color:#3A2A00;}
  .tag.warn{background:#F7E1D8;color:#8A3515;}
  .res-body h2{margin:0;font-size:30px;font-weight:800;line-height:1.1;}
  .res-body .latin{font-size:18px;color:var(--ink-soft);margin:4px 0 0;}
  .res-body p.fact{margin:14px 0 0;font-size:16.5px;}
  .res-body p.sub{margin:14px 0 0;color:var(--ink-soft);}
  .scan-text{text-align:center;padding:26px 0;font-weight:800;font-size:20px;}
  .scan-text span{display:block;font-weight:600;font-size:15px;color:var(--ink-soft);margin-top:4px;}
  .dots i{display:inline-block;animation:blink 1.2s infinite;font-style:normal;}
  .dots i:nth-child(2){animation-delay:.2s;}
  .dots i:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
  .progress-line{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;}
  .progress-line b{font-weight:800;}
  .progress-line .bar{height:6px;border-radius:6px;background:var(--line);margin-top:8px;overflow:hidden;}
  .progress-line .bar i{display:block;height:100%;background:var(--leaf);border-radius:6px;}
  .rankup{
    margin-top:12px;background:var(--leaf-deep);color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;
  }
  .btn-row{display:flex;flex-direction:column;gap:10px;margin-top:22px;}
  .btn{
    border:none;border-radius:14px;padding:15px 18px;font-size:17px;font-weight:800;min-height:52px;
    background:var(--leaf);color:#fff;
  }
  .btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);}
  .btn.danger{background:var(--clay);}
  .pop{animation:pop .6s cubic-bezier(.2,1.4,.3,1) both;}
  @keyframes pop{0%{transform:scale(1.18) rotate(-3deg);opacity:0}100%{transform:none;opacity:1}}

  /* Detail sheet */
  #detail{background:rgba(10,20,12,.5);}
  .sheet{
    position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(480px,100%);
    background:var(--bg);border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:90vh;overflow-y:auto;animation:rise .25s ease;
  }
  @keyframes rise{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:-8px auto 14px;}
  .sheet .big{
    width:100%;aspect-ratio:1.4;border-radius:18px;overflow:hidden;background:var(--leaf-tint);
    display:grid;place-items:center;margin-bottom:14px;
  }
  .sheet .big img{width:100%;height:100%;object-fit:cover;}
  .sheet .big .ph{font-size:64px;filter:grayscale(1);opacity:.35;}
  .sheet h2{margin:0;font-size:26px;font-weight:800;}
  .sheet .meta{color:var(--ink-soft);font-weight:600;font-size:14px;margin-top:6px;}

  /* Stats screen */
  .rank-card{
    background:var(--leaf-deep);color:#fff;border-radius:20px;padding:20px;margin-bottom:18px;
  }
  .rank-card small{font-weight:700;opacity:.8;}
  .rank-card h2{margin:2px 0 10px;font-size:30px;font-weight:800;line-height:1.1;}
  .rank-card .bar{height:8px;border-radius:8px;background:rgba(255,255,255,.25);overflow:hidden;}
  .rank-card .bar i{display:block;height:100%;background:var(--sun);border-radius:8px;}
  .rank-card p{margin:10px 0 0;font-size:14.5px;opacity:.92;}
  .stat-h{margin:22px 0 10px;font-size:18px;font-weight:800;}
  .cat-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-bottom:12px;font-weight:700;}
  .cat-row span:last-child{color:var(--ink-soft);}
  .cat-row .section-bar{grid-column:1/-1;margin:0;}
  .reset{margin-top:34px;text-align:center;}
  .reset button{background:none;border:none;color:var(--ink-soft);text-decoration:underline;font-size:14px;padding:10px;}
  .reset .confirm{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;}
  .toast{
    position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%);z-index:80;
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:88vw;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- Albumas -->
  <main class="screen active" id="screen-album" aria-label="Albumas">
    <div class="topbar">
      <div>
        <h1>Augalų šimtukas</h1>
        <p>Rask, nufotografuok ir užpildyk albumą.</p>
      </div>
      <div class="ring" id="ring" aria-label="Rasta augalų"></div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filtras"></div>
    <div id="album"></div>
  </main>

  <!-- Pasiekimai -->
  <main class="screen" id="screen-stats" aria-label="Pasiekimai">
    <div class="topbar"><div><h1>Pasiekimai</h1><p>Tavo kelias iki šimto augalų.</p></div></div>
    <div id="stats"></div>
  </main>

  <nav class="nav" aria-label="Pagrindinis meniu">
    <button class="tab" id="tab-album" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Albumas
    </button>
    <button class="fab" id="open-camera" aria-label="Fotografuoti augalą">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.2" r="3.6"/></svg>
    </button>
    <button class="tab" id="tab-stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
      Pasiekimai
    </button>
  </nav>
</div>

<!-- Kamera -->
<div class="overlay" id="camera" role="dialog" aria-label="Kamera">
  <video id="video" playsinline autoplay muted></video>
  <div class="shade-top"></div><div class="shade-bot"></div>
  <button class="cam-close" id="cam-close" aria-label="Uždaryti kamerą">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
  <div class="reticle"><i></i><i></i><i></i><i></i></div>
  <div class="cam-tip" id="cam-tip">Nutaikyk į augalą: lapus, žiedus ar žievę</div>
  <div class="cam-bar">
    <button class="gallery" id="pick-btn" aria-label="Pasirinkti nuotrauką iš galerijos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>
    </button>
    <button class="shutter" id="shutter" aria-label="Nufotografuoti"></button>
    <span></span>
  </div>
  <div class="cam-fallback" id="cam-fallback">
    <p id="cam-fallback-msg">Kamera neatsidarė. Gali nufotografuoti telefono kamera.</p>
    <button class="btn" id="snap-btn">Fotografuoti</button>
    <button class="btn ghost" id="pick-btn2">Pasirinkti iš galerijos</button>
  </div>
</div>
<input type="file" id="snap-input" accept="image/*" capture="environment" hidden>
<input type="file" id="pick-input" accept="image/*" hidden>

<!-- Rezultatas -->
<div class="overlay" id="result" role="dialog" aria-label="Atpažinimo rezultatas"></div>

<!-- Augalo kortelė -->
<div class="overlay" id="detail" role="dialog" aria-label="Augalo informacija"></div>

let state = {found:{}, others:[]};
let storageOk = true;
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const s = JSON.parse(raw); state = {found:s.found||{}, others:s.others||[]}; }
  }catch(e){ storageOk = false; }
}
function saveState(){
  if(!storageOk) return false;
  for(let attempt=0; attempt<4; attempt++){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; }
    catch(e){
      // Trūksta vietos: pirmiausia numetame senų „kitų radinių“ nuotraukas.
      const withThumb = state.others.find(o => o.thumb);
      if(withThumb){ delete withThumb.thumb; continue; }
      if(state.others.length){ state.others.shift(); continue; }
      storageOk = false; return false;
    }
  }
  return false;
}
const foundCount = () => Object.keys(state.found).length;
const rankFor = n => { let r = RANKS[0]; for(const x of RANKS){ if(n >= x[0]) r = x; } return r; };
const nextRank = n => RANKS.find(x => x[0] > n) || null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
function drawScaled(src, w, h, max, q){
  const s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
function loadImg(url){
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
}
async function fileToJpeg(file){
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch(e){
    const url = URL.createObjectURL(file);
    try{ bmp = await loadImg(url); } finally { URL.revokeObjectURL(url); }
  }
  return drawScaled(bmp, bmp.width || bmp.naturalWidth, bmp.height || bmp.naturalHeight, 768, 0.8);
}
async function makeThumb(dataUrl){
  const img = await loadImg(dataUrl);
  const S = 240, m = Math.min(img.width, img.height);
  const c = document.createElement('canvas'); c.width = S; c.height = S;
  c.getContext('2d').drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S, S);
  return c.toDataURL('image/jpeg', 0.72);
}

let filter = 'all';
function ringSVG(n){
  const R = 26, C = 2 * Math.PI * R, off = C * (1 - n / 100);
  return `<svg viewBox="0 0 62 62"><circle class="track" cx="31" cy="31" r="${R}" fill="none" stroke-width="6"/>
    <circle class="bar" cx="31" cy="31" r="${R}" fill="none" stroke-width="6" stroke-linecap="round"
    stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
    <div class="num">${n}<small>iš 100</small></div>`;
}
function renderChips(){
  const opts = [['all','Visi'],['found','Rasti'],['missing','Trūksta'], ...Object.entries(CATS).map(([k,v]) => [k, v.label])];
  $('chips').innerHTML = opts.map(([k,l]) =>
    `<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${esc(l)}</button>`).join('');
}
function cardHTML(p){
  const f = state.found[p.id];
  if(f){
    return `<button class="card" data-id="${p.id}" aria-label="${esc(p.name)}, rasta">
      <div class="pic">${f.thumb ? `<img src="${f.thumb}" alt="">` : `<span class="ph" style="filter:none;opacity:1">${CATS[p.cat].emoji}</span>`}</div>
      <div class="nm">${esc(p.name)}</div><span class="tick">✓</span></button>`;
  }
  return `<button class="card missing" data-id="${p.id}" aria-label="${esc(p.name)}, dar nerasta">
    <div class="pic"><span class="ph">${CATS[p.cat].emoji}</span></div>
    <div class="nm">${esc(p.name)}</div></button>`;
}
function renderAlbum(){
  const n = foundCount();
  $('ring').innerHTML = ringSVG(n);
  $('ring').setAttribute('aria-label', `Rasta ${n} iš 100 augalų`);
  renderChips();
  let html = '';
  for(const [key, cat] of Object.entries(CATS)){
    if(filter in CATS && filter !== key) continue;
    const all = PLANTS.filter(p => p.cat === key);
    const got = all.filter(p => state.found[p.id]).length;
    let list = all;
    if(filter === 'found') list = all.filter(p => state.found[p.id]);
    if(filter === 'missing') list = all.filter(p => !state.found[p.id]);
    if(!list.length) continue;
    html += `<section class="section"><div class="section-head"><h2>${esc(cat.label)}</h2><span>${got}/${all.length}</span></div>
      <div class="section-bar"><i style="width:${got/all.length*100}%;background:${cat.color}"></i></div>
      <div class="grid">${list.map(cardHTML).join('')}</div></section>`;
  }
  if(!html){
    html = filter === 'found'
      ? `<div class="empty"><b>Albumas dar tuščias.</b><br>Paspausk žalią kamerą ir nufotografuok pirmą augalą.</div>`
      : `<div class="empty"><b>Visi augalai rasti!</b></div>`;
  }
  $('album').innerHTML = html;
}
$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  filter = b.dataset.f; renderAlbum();
});
$('album').addEventListener('click', e => {

let confirmReset = false;
function renderStats(){
  const n = foundCount(), r = rankFor(n), nx = nextRank(n);
  const prevAt = r[0], nextAt = nx ? nx[0] : 100;
  const pct = nx ? (n - prevAt) / (nextAt - prevAt) * 100 : 100;
  let html = `<div class="rank-card"><small>Tavo rangas</small><h2>${esc(r[1])}</h2>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <p>${nx ? `Dar ${nextAt - n} ${nextAt - n === 1 ? 'augalas' : (nextAt - n < 10 ? 'augalai' : 'augalų')} iki rango „${esc(nx[1])}“.` : 'Surinkai visą šimtuką. Puiku!'}</p></div>`;
  html += `<h3 class="stat-h">Pagal grupes</h3>`;
  for(const [key, cat] of Object.entries(CATS)){
    const all = PLANTS.filter(p => p.cat === key), got = all.filter(p => state.found[p.id]).length;
    html += `<div class="cat-row"><span>${cat.emoji} ${esc(cat.label)}</span><span>${got}/${all.length}</span>
      <div class="section-bar"><i style="width:${got/all.length*100}%;background:${cat.color}"></i></div></div>`;
  }
  if(state.others.length){
    html += `<h3 class="stat-h">Kiti radiniai (${state.others.length})</h3><div class="grid">` +
      state.others.slice().reverse().map(o => `<div class="card" style="cursor:default">
        <div class="pic">${o.thumb ? `<img src="${o.thumb}" alt="">` : `<span class="ph">🌱</span>`}</div>
        <div class="nm">${esc(o.name)}</div></div>`).join('') + `</div>`;
  }
  html += `<div class="reset">` + (confirmReset
    ? `<div class="confirm"><span>Ištrinti visą albumą?</span><button class="btn danger" id="reset-yes" style="padding:10px 16px;min-height:44px;font-size:15px">Taip, ištrinti</button><button class="btn ghost" id="reset-no" style="padding:10px 16px;min-height:44px;font-size:15px">Ne</button></div>`
    : `<button id="reset-ask">Pradėti iš naujo</button>`) + `</div>`;
  $('stats').innerHTML = html;
}
$('stats').addEventListener('click', e => {
  if(e.target.id === 'reset-ask'){ confirmReset = true; renderStats(); }
  if(e.target.id === 'reset-no'){ confirmReset = false; renderStats(); }
  if(e.target.id === 'reset-yes'){
    state = {found:{}, others:[]}; saveState(); confirmReset = false;
    renderAlbum(); renderStats(); toast('Albumas išvalytas.');
  }
});

let stream = null, busy = false;
async function openCamera(){
  $('camera').classList.add('open');
  $('cam-fallback').classList.remove('show');
  $('shutter').disabled = false;
  document.body.style.overflow = 'hidden';
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return showFallback('Ši naršyklė neleidžia naudoti kameros tiesiogiai.');
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:960}}, audio:false
    });
    $('video').srcObject = stream;
    await $('video').play().catch(() => {});
  }catch(e){
    showFallback('Kamera neatsidarė. Leisk naršyklei naudoti kamerą arba nufotografuok telefono kamera.');
  }
}
function showFallback(msg){
  $('cam-fallback-msg').textContent = msg;
  $('cam-fallback').classList.add('show');
}
function stopStream(){
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('video').srcObject = null;
}
function closeCamera(){
  stopStream();
  $('camera').classList.remove('open');
  document.body.style.overflow = '';
}
$('open-camera').onclick = () => openCamera();
$('cam-close').onclick = closeCamera;
$('shutter').onclick = () => {
  const v = $('video');
  if(busy || !v.videoWidth) return;
  const photo = drawScaled(v, v.videoWidth, v.videoHeight, 768, 0.8);
  runIdentify(photo);
};
$('pick-btn').onclick = () => $('pick-input').click();
$('pick-btn2').onclick = () => $('pick-input').click();
$('snap-btn').onclick = () => $('snap-input').click();
for(const id of ['pick-input','snap-input']){
  $(id).addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!file) return;
    try{ runIdentify(await fileToJpeg(file)); }
    catch(err){ toast('Nepavyko atidaryti nuotraukos.'); }
  });
}

// ============================================================
// Atpažinimas
// ============================================================
async function identify(dataUrl){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 35000);
  try{
    const res = await fetch(API_PROXY_URL, {
      method:'POST', headers:{'Content-Type':'application/json'}, signal:ctrl.signal,
      body: JSON.stringify({
        model: MODEL, max_tokens: 500, thinking: {type: 'disabled'}, system: SYSTEM_PROMPT,
        messages:[{role:'user', content:[
          {type:'image', source:{type:'base64', media_type:'image/jpeg', data:dataUrl.split(',')[1]}},
          {type:'text', text:'Atpažink augalą šioje nuotraukoje.'}
        ]}]
      })
    });
    if(!res.ok) throw new Error('http ' + res.status);
    const data = await res.json();
    const txt = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
    const m = txt.match(/\{[\s\S]*\}/);
    if(!m) throw new Error('parse');
    return JSON.parse(m[0]);
  } finally { clearTimeout(timer); }
}

async function runIdentify(photo){
  busy = true;
  stopStream();
  $('camera').classList.remove('open');
  renderResult('scan', {photo});
  try{
    const r = await identify(photo);
    await handleResult(r, photo);
  }catch(err){
    renderResult('error', {photo});
  }finally{ busy = false; }
}

async function handleResult(r, photo){
  const conf = ['high','medium','low'].includes(r.confidence) ? r.confidence : 'low';
  const p = r.id && BY_ID[r.id] ? BY_ID[r.id] : null;
  if(r.from_screen_or_print) return renderResult('screen', {photo});
  if(!r.is_plant) return renderResult('noplant', {photo});
  if(p && conf !== 'low'){
    if(state.found[p.id]) return renderResult('dup', {photo, p, r});
    const before = foundCount();
    state.found[p.id] = {thumb: await makeThumb(photo), date: today(), fact: r.fact || '', conf};
    const saved = saveState();
    const after = foundCount();
    const rankUp = rankFor(after)[1] !== rankFor(before)[1] ? rankFor(after)[1] : null;
    renderAlbum();
    return renderResult('new', {photo, p, r, rankUp, saved});
  }
  if(conf === 'low') return renderResult('unsure', {photo, r, p});
  // Tikras augalas, bet ne iš šimtuko
  const name = r.name_lt || 'Nežinomas augalas';
  if(!state.others.some(o => o.name.toLowerCase() === name.toLowerCase())){
    state.others.push({name, latin: r.latin || '', date: today(), thumb: await makeThumb(photo)});
    if(state.others.length > 40) state.others.shift();
    saveState();
  }
  return renderResult('other', {photo, r});
}

// ============================================================
// Rezultato ekranas
// ============================================================
function renderResult(kind, d){
  const n = foundCount();
  const photoCls = kind === 'new' ? 'res-photo pop' : 'res-photo';
  let body = '';
  const progress = `<div class="progress-line"><b>Albume: ${n} iš 100</b><div class="bar"><i style="width:${n}%"></i></div></div>`;
  const again = `<button class="btn" id="res-again">Fotografuoti dar</button>`;
  const toAlbum = `<button class="btn ghost" id="res-album">Į albumą</button>`;
  const r = d.r || {};

  if(kind === 'scan'){
    body = `<div class="scan-text">Skenuojama<span class="dots"><i>.</i><i>.</i><i>.</i></span><span>Claude žiūri, koks čia augalas.</span></div>`;
  } else if(kind === 'new'){
    body = `<span class="tag new">Naujas atradimas</span>
      <h2>${esc(d.p.name)}</h2><div class="latin">${esc(d.p.latin)}</div>
      <p class="fact">${esc(r.fact || '')}</p>
      ${d.rankUp ? `<div class="rankup">Naujas rangas: ${esc(d.rankUp)}</div>` : ''}
      ${progress}
      ${d.saved === false ? `<p class="sub">Albumo šioje naršyklėje išsaugoti nepavyko, todėl užsidarius puslapiui jis dings.</p>` : ''}
      <div class="btn-row">${again}${toAlbum}</div>`;
  } else if(kind === 'dup'){
    body = `<span class="tag">Jau turi šį augalą</span>
      <h2>${esc(d.p.name)}</h2><div class="latin">${esc(d.p.latin)}</div>
      <p class="fact">${esc(r.fact || '')}</p>${progress}
      <div class="btn-row"><button class="btn" id="res-replace">Pakeisti nuotrauką albume</button>${again}${toAlbum}</div>`;
  } else if(kind === 'other'){
    body = `<span class="tag">Radinys ne iš šimtuko</span>
      <h2>${esc(r.name_lt || 'Nežinomas augalas')}</h2>${r.latin ? `<div class="latin">${esc(r.latin)}</div>` : ''}
      <p class="fact">${esc(r.fact || '')}</p>
      <p class="sub">Šio augalo nėra tavo šimtuke, bet įrašėme jį į „Kitus radinius“ skiltyje Pasiekimai.</p>
      <div class="btn-row">${again}${toAlbum}</div>`;
  } else if(kind === 'unsure'){
    const guess = d.p ? d.p.name : r.name_lt;
    body = `<span class="tag warn">Nesu tikras</span>
      <h2>${guess ? 'Gal tai ' + esc(guess) + '?' : 'Nepavyko atpažinti'}</h2>
      <p class="fact">${esc(r.advice || 'Pabandyk nufotografuoti iš arčiau: lapą, žiedą ar žievę, esant geresnei šviesai.')}</p>
      <div class="btn-row">${again}${toAlbum}</div>`;
  } else if(kind === 'noplant'){
    body = `<span class="tag warn">Čia nematau augalo</span>
      <h2>Surask augalą</h2>
      <p class="fact">Nutaikyk kamerą į lapus, žiedus ar žievę ir pabandyk dar kartą.</p>
      <div class="btn-row">${again}${toAlbum}</div>`;
  } else if(kind === 'screen'){
    body = `<span class="tag warn">Tai nuotrauka ekrane ar popieriuje</span>
      <h2>Reikia tikro augalo</h2>
      <p class="fact">Išeik į lauką, į sodą ar prie palangės ir nufotografuok augalą gyvai.</p>
      <div class="btn-row">${again}${toAlbum}</div>`;
  } else if(kind === 'error'){
    body = `<span class="tag warn">Nepavyko susisiekti</span>
      <h2>Bandyk dar kartą</h2>
      <p class="fact">Patikrink interneto ryšį. Nuotrauka dar nepamesta.</p>
      <div class="btn-row"><button class="btn" id="res-retry">Bandyti dar kartą</button>${again}</div>`;
  }

  $('result').innerHTML = `<div class="${photoCls}"><img src="${d.photo}" alt="Tavo nuotrauka">
    ${kind === 'scan' ? '<div class="scanline"></div>' : ''}</div>
    <div class="res-body" aria-live="polite">${body}</div>`;
  $('result').classList.add('open');
  $('result').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  currentPhoto = d.photo; currentDup = d.p || null; currentR = d.r || null;
  if(kind === 'new') lastNewId = d.p.id; else if(kind !== 'scan') lastNewId = null;
}
let currentPhoto = null, currentDup = null, currentR = null, lastNewId = null;

function closeResult(){
  $('result').classList.remove('open');
  document.body.style.overflow = '';
}
$('result').addEventListener('click', async e => {
  const id = e.target.id;
  if(id === 'res-again'){ closeResult(); openCamera(); }
  if(id === 'res-album'){ closeResult(); setTab('album'); flashNew(); }
  if(id === 'res-retry'){ runIdentify(currentPhoto); }
  if(id === 'res-replace' && currentDup){
    state.found[currentDup.id].thumb = await makeThumb(currentPhoto);
    if(currentR && currentR.fact) state.found[currentDup.id].fact = currentR.fact;
    saveState(); renderAlbum(); toast('Nuotrauka pakeista.');
    closeResult(); setTab('album');
  }
});
function flashNew(){
  if(!lastNewId) return;
  if(filter === 'missing'){ filter = 'all'; renderAlbum(); }
  const el = document.querySelector(`.card[data-id="${lastNewId}"]`);
  if(el){ el.scrollIntoView({block:'center'}); el.classList.add('flash'); }
}

document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if($('detail').classList.contains('open')) closeDetail();
  else if($('result').classList.contains('open') && !busy) closeResult();
  else if($('camera').classList.contains('open')) closeCamera();
});

// ============================================================
// Pradžia
// ============================================================
loadState();
renderAlbum();
if(!storageOk) toast('Šioje naršyklėje albumas nebus išsaugotas.');
</script>
